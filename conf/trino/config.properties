# Одноузловой Trino (координатор = воркер).
# Q18 агрегирует lineitem по orderkey (на sf4 — 6 млн групп), а Silver строится
# джойном агрегата с orders, поэтому лимит памяти запроса поднят с 30 % кучи (по умолчанию) до 3 ГБ.
# Требование: Docker с памятью >= 7 ГБ (куча = 80 % памяти контейнера; 3 ГБ + 30 % кучи на резерв).
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080
query.max-memory=3GB
query.max-memory-per-node=3GB
