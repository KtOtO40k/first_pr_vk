# Каталог "lake": таблицы Apache Iceberg, метаданные — Lakekeeper (REST), файлы — MinIO (S3)
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://catalog:8181/catalog
iceberg.rest-catalog.warehouse=lakehouse
iceberg.file-format=PARQUET
iceberg.compression-codec=ZSTD

fs.native-s3.enabled=true
s3.endpoint=http://object-store:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=lakeadmin
s3.aws-secret-key=lakeadmin-secret
